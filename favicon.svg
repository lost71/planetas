<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="astroGrad" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="6" y1="36" x2="58" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffb703" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#00f0ff" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fundo escuro espacial circular -->
  <circle cx="32" cy="32" r="29" fill="#040817" stroke="#1d2d50" stroke-width="1.5"/>

  <!-- Trás do anel orbital do astro -->
  <path d="M 9 32 C 12 24, 52 20, 55 28" stroke="url(#ringGrad)" stroke-width="3" stroke-linecap="round" opacity="0.35"/>

  <!-- Esfera do Astro / Planeta -->
  <circle cx="32" cy="32" r="16" fill="url(#astroGrad)" filter="url(#glow)"/>

  <!-- Faixas e crateras luminosas -->
  <path d="M 19 28 C 24 24, 40 24, 45 28" stroke="rgba(255, 255, 255, 0.45)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 17 34 C 23 38, 41 38, 47 34" stroke="rgba(0, 0, 0, 0.3)" stroke-width="2" stroke-linecap="round"/>

  <!-- Frente do anel cósmico -->
  <path d="M 7 34 C 10 44, 54 40, 57 30" stroke="url(#ringGrad)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Brilhos estelares cósmicos -->
  <path d="M 13 13 L 14.5 16.5 L 18 18 L 14.5 19.5 L 13 23 L 11.5 19.5 L 8 18 L 11.5 16.5 Z" fill="#ffffff"/>
  <path d="M 49 11 L 50 13 L 52 14 L 50 15 L 49 17 L 48 15 L 46 14 L 48 13 Z" fill="#00f0ff"/>
  <circle cx="51" cy="48" r="1.8" fill="#ffb703"/>
  <circle cx="16" cy="47" r="1.4" fill="#ffffff"/>
</svg>
